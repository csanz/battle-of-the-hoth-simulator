<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SNOWFLOW — Battle of Hoth · flight test</title>
<style>
    :root { --frost: #dbe6f2; --frost-dim: #7d8ea3; --accent: #8fc4e8; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05080d;
        font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--frost); }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
        outline: none; touch-action: none; }

    #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: radial-gradient(120% 90% at 50% 42%, #16202e 0%, #0a1019 55%, #05080d 100%);
        transition: opacity 700ms ease; }
    #boot.gone { opacity: 0; pointer-events: none; }
    .boot-inner { text-align: center; width: min(460px, 78vw); }
    .wordmark { font-size: clamp(20px, 3vw, 34px); font-weight: 200; letter-spacing: 0.5em;
        text-indent: 0.5em; }
    .tagline { margin-top: 1.4em; font-size: 10px; letter-spacing: 0.3em;
        text-transform: uppercase; color: var(--frost-dim); }
    .bar { position: relative; margin: 3em auto 0; width: 100%; height: 1px;
        background: rgba(219,230,242,0.13); overflow: hidden; }
    .bar-fill { position: absolute; inset: 0 auto 0 0; width: 0%;
        background: linear-gradient(90deg, transparent, var(--accent) 60%, #eaf4ff); }
    .phase { margin-top: 1.4em; height: 1em; font-size: 10px; letter-spacing: 0.2em;
        text-transform: uppercase; color: var(--frost-dim); }

    .gate { margin-top: 1.6em; opacity: 0; pointer-events: none; transition: opacity 400ms ease; }
    .gate.show { opacity: 1; pointer-events: auto; }
    .gate-btn { background: rgba(143,196,232,0.06); color: var(--frost-dim);
        border: 1px solid rgba(143,196,232,0.18); border-radius: 2px; padding: 12px 24px;
        min-width: 184px; font: inherit; font-size: 10px; letter-spacing: 0.22em;
        text-transform: uppercase; cursor: pointer; }
    .gate-btn:hover { color: #eaf4ff; background: rgba(143,196,232,0.15); }
    .gate-note { margin-top: 12px; font-size: 9px; letter-spacing: 0.18em;
        text-transform: uppercase; color: rgba(125,142,163,0.7); }

    #hint { position: fixed; left: 50%; bottom: 24px; z-index: 50; transform: translateX(-50%);
        font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
        color: rgba(219,230,242,0.45); text-shadow: 0 1px 12px rgba(0,0,0,0.8);
        pointer-events: none; opacity: 0; transition: opacity 700ms ease; }
    #hint.show { opacity: 1; }

    #nogpu { position: fixed; inset: 0; display: none; place-items: center; text-align: center;
        padding: 24px; font-size: 12px; line-height: 1.8; z-index: 200; background: #05080d; }
    #nogpu.show { display: grid; }
</style>
</head>
<body>
    <canvas id="view" tabindex="0"></canvas>
    <div id="hint">wasd to fly &nbsp;·&nbsp; shift to boost &nbsp;·&nbsp; space to fire &nbsp;·&nbsp; f1 for settings</div>

    <div id="boot">
        <div class="boot-inner">
            <div class="wordmark">FLIGHT TEST</div>
            <div class="tagline">speeder, terrain, sky — nothing else</div>
            <div class="bar"><div class="bar-fill" id="boot-bar"></div></div>
            <div class="phase" id="boot-phase">initialising</div>
            <div class="gate" id="boot-gate">
                <button class="gate-btn" id="gate-enter" type="button">enter</button>
                <div class="gate-note">sound on &nbsp;·&nbsp; headphones recommended</div>
            </div>
        </div>
    </div>

    <div id="nogpu">
        <div><b>WebGL2 is not available in this browser.</b><br />
        Try an up-to-date browser on a desktop GPU.</div>
    </div>

    <script type="module" src="/src/jet.js"></script>
</body>
</html>
